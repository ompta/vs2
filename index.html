<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vampyre Survivors</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0710;font-family:'Segoe UI',system-ui,sans-serif;color:#e8e0f0;user-select:none;touch-action:none}
#game{position:fixed;inset:0;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.hud-panel{position:absolute;background:rgba(15,10,24,.55);border:1px solid rgba(150,90,255,.25);border-radius:8px}
#hpwrap{left:12px;top:12px;width:min(360px,42vw);height:26px;overflow:hidden;box-shadow:0 0 12px rgba(255,0,40,.25)}
#hpbar{height:100%;width:100%;background:linear-gradient(90deg,#7a0f22,#e0243e);transition:width .12s linear}
#hpwrap.low{animation:pulse .6s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 12px rgba(255,0,40,.3)}to{box-shadow:0 0 22px rgba(255,40,60,.85)}}
#xpwrap{left:12px;top:46px;width:min(360px,42vw);height:10px;background:rgba(20,14,32,.8);border-radius:5px;overflow:hidden}
#xpbar{height:100%;width:0%;background:linear-gradient(90deg,#4f8cff,#9fe0ff)}
#levelbadge{left:12px;top:62px;font-size:12px;font-weight:700;letter-spacing:1px;padding:4px 10px;color:#c9a6ff}
#timer{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:30px;font-weight:800;letter-spacing:3px;color:#f3ecff;text-shadow:0 0 14px rgba(150,80,255,.7);background:rgba(15,10,24,.55);padding:6px 22px;border:1px solid rgba(150,90,255,.3);border-radius:8px}
#timer.warn{color:#ff7b6b;text-shadow:0 0 14px rgba(255,80,60,.8)}
#scorebox{right:12px;top:12px;text-align:right;padding:8px 14px;font-size:13px;line-height:1.7}
#scorebox b{color:#ffd27a}
#weapons{display:none}
#weapons.show{position:absolute;left:50%;top:50%;transform:translate(-50%,70px);display:flex;gap:8px}
.wchip{width:52px;background:rgba(15,10,24,.65);border:1px solid rgba(150,90,255,.35);border-radius:8px;padding:5px 0 4px;text-align:center}
.wchip .ic{font-size:22px;line-height:1.1}
.wchip .pips{display:flex;gap:3px;justify-content:center;margin-top:3px}
.wchip .pip{width:6px;height:6px;border-radius:50%;background:rgba(160,120,255,.25)}
.wchip .pip.on{background:#b07cff;box-shadow:0 0 6px #b07cff}
#bossbar{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:min(520px,60vw);display:none}
#bossname{font-size:12px;font-weight:700;letter-spacing:2px;color:#d78cff;text-align:center;margin-bottom:4px;text-shadow:0 0 8px rgba(190,80,255,.8)}
#bosswrap{height:12px;background:rgba(20,12,34,.85);border:1px solid rgba(190,80,255,.5);border-radius:6px;overflow:hidden}
#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#6a1fb0,#c95cff)}
#hint{position:absolute;right:14px;bottom:12px;font-size:11px;color:rgba(220,200,255,.55);letter-spacing:1px}
#joy{position:fixed;left:0;top:0;width:120px;height:120px;border-radius:50%;background:rgba(15,10,24,.4);border:2px solid rgba(150,90,255,.45);pointer-events:none;touch-action:none;z-index:6;display:none}
#joy.on{display:block}
#joystick{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;background:rgba(176,124,255,.55);border:2px solid rgba(220,180,255,.9);transform:translate(-50%,-50%);pointer-events:none}
.tbtn{position:fixed;right:12px;width:46px;height:46px;border-radius:50%;background:rgba(15,10,24,.7);border:1px solid rgba(150,90,255,.45);color:#c9a6ff;font-size:18px;pointer-events:auto;touch-action:none;z-index:6;display:none}
#tbtn-pause{top:12px}
#tbtn-mute{top:66px}
body.touch .tbtn{display:block}
body.touch #scorebox{right:74px}
body.touch #hint,body.touch #mute{display:none}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,4,12,.72);z-index:10}
.hidden{display:none!important}
.cardbox{background:linear-gradient(180deg,rgba(26,16,44,.96),rgba(14,9,24,.96));border:1px solid rgba(170,100,255,.45);border-radius:14px;padding:34px 44px;text-align:center;box-shadow:0 0 60px rgba(120,40,220,.35);max-width:92vw}
h1.title{font-size:clamp(34px,6vw,64px);font-weight:900;letter-spacing:6px;color:#e9dcff;text-shadow:0 0 24px rgba(190,80,255,.9),0 0 60px rgba(255,30,70,.4)}
h1.title .vamp{color:#ff4d63}
.sub{margin-top:10px;color:#b79be0;letter-spacing:2px;font-size:14px}
.controls{margin:22px 0 6px;font-size:13px;line-height:2;color:#cbb9ea}
.controls b{color:#ffd27a;background:rgba(255,210,120,.1);padding:2px 8px;border-radius:5px;font-weight:600}
button.big{margin-top:22px;pointer-events:auto;cursor:pointer;font-size:18px;font-weight:800;letter-spacing:2px;color:#160b26;background:linear-gradient(180deg,#e9c9ff,#b07cff);border:none;border-radius:10px;padding:14px 46px;box-shadow:0 6px 24px rgba(176,124,255,.45);transition:transform .1s}
button.big:hover{transform:scale(1.05)}
#lvlTitle{font-size:26px;font-weight:800;letter-spacing:3px;color:#ffd27a;text-shadow:0 0 16px rgba(255,200,80,.6)}
#lvlChoices{display:flex;gap:16px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.choice{width:190px;min-height:210px;background:rgba(30,18,52,.9);border:2px solid rgba(160,100,255,.4);border-radius:12px;padding:18px 14px;cursor:pointer;pointer-events:auto;text-align:center;transition:transform .12s,border-color .12s,box-shadow .12s}
.choice:hover{transform:translateY(-6px);border-color:#c98cff;box-shadow:0 10px 30px rgba(160,80,255,.4)}
.choice .ic{font-size:44px}
.choice .nm{margin-top:10px;font-size:16px;font-weight:800;color:#efe2ff}
.choice .lv{font-size:11px;color:#9fe0ff;margin-top:3px;letter-spacing:1px}
.choice .ds{font-size:12px;color:#a992c9;margin-top:10px;line-height:1.5;min-height:54px}
.choice .key{margin-top:8px;font-size:11px;color:#ffd27a;letter-spacing:1px}
.stats{margin:20px auto 0;font-size:15px;line-height:2.1;color:#cbb9ea;max-width:420px}
.stats b{color:#ffd27a}
#mute{position:fixed;left:12px;bottom:58px;z-index:6;font-size:11px;color:rgba(220,200,255,.6);letter-spacing:1px;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="hpwrap" class="hud-panel"><div id="hpbar"></div></div>
  <div id="xpwrap"><div id="xpbar"></div></div>
  <div id="levelbadge" class="hud-panel">LV 1</div>
  <div id="timer">15:00</div>
  <div id="scorebox" class="hud-panel"><div>SCORE <b id="score">0</b></div><div>KILLS <b id="kills">0</b></div></div>
  <div id="bossbar"><div id="bossname">⚰ THE LICH KING</div><div id="bosswrap"><div id="bossfill"></div></div></div>
  <div id="weapons"></div>
  <div id="hint">WASD / ARROWS move · P pause · M mute</div>
  <div id="mute">M mute</div>
  <div id="joy"><div id="joystick"></div></div>
  <button class="tbtn" id="tbtn-pause" aria-label="pause">⏸</button>
  <button class="tbtn" id="tbtn-mute" aria-label="mute">🔊</button>
</div>
<div id="levelup" class="overlay hidden"><div class="cardbox">
  <div id="lvlTitle">LEVEL UP!</div>
  <div id="lvlChoices"></div>
  <div class="sub" style="margin-top:20px">pick an upgrade — click or press 1 / 2 / 3</div>
</div></div>
<div id="screen" class="overlay"><div class="cardbox" id="screenCard"></div></div>
<script>
"use strict";
/* ================= utilities ================= */
const TAU = Math.PI*2;
const $ = id => document.getElementById(id);
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function dist2(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}
function hash2(x,y){let h=(x*374761393+y*668265263)^0;h=(h^(h>>13))*1274126177;return ((h^(h>>16))>>>0)/4294967295;}
function fmtTime(t){t=Math.max(0,Math.ceil(t));const m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+(s<10?"0":"")+s;}

/* ================= canvas ================= */
const canvas = $("game"), ctx = canvas.getContext("2d");
let W=0,H=0;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
addEventListener("resize",resize);resize();

/* ================= audio (tiny synth) ================= */
let actx=null,muted=false;
const music=new Audio("boss.m4a");
music.loop=true;music.volume=.55;
function beep(freq,dur,type,vol,slide){
  if(muted||!actx)return;
  try{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||"square";o.frequency.value=freq;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),actx.currentTime+dur);
    g.gain.value=vol||.05;g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
function sfx(name){
  if(!actx)return;
  if(name==="shoot")beep(680,.08,"square",.02,-300);
  else if(name==="slash")beep(220,.1,"sawtooth",.03,200);
  else if(name==="nova")beep(110,.3,"sine",.06,-60);
  else if(name==="hitp")beep(90,.25,"sawtooth",.08,-40);
  else if(name==="gem")beep(880,.07,"sine",.03,300);
  else if(name==="level")beep(440,.3,"sine",.06,660);
  else if(name==="die")beep(70,.4,"sawtooth",.05,-30);
  else if(name==="boss")beep(55,.8,"sawtooth",.09,-20);
  else if(name==="win")beep(523,.5,"sine",.07,523);
}
function startMusic(){
  if(muted)return;
  try{music.currentTime=0;music.play().catch(()=>{});}catch(e){}
}

/* ================= game data ================= */
const WIN_TIME = 15*60; // survive 15 minutes
const UPGRADES = {
  garlic:{name:"Garlic Blade",icon:"⚔️",max:5,base:"weapon",desc:l=>`Slashes ${1+Math.floor((l-1)/2)} nearest fiends. DMG ${14+6*l}`},
  bullet:{name:"Silver Bullet",icon:"🔫",max:5,base:"weapon",desc:l=>`Fires ${1+Math.floor((l-1)/3)} piercing bullets. DMG ${10+4*l}`},
  nova:  {name:"Holy Nova",icon:"🕊️",max:5,base:"weapon",desc:l=>`Holy pulse around you. DMG ${8+5*l} · radius ${90+16*l}`},
  orbit: {name:"Orbiting Blades",icon:"🌀",max:5,base:"weapon",desc:l=>`${2+l} blades whirl around you. DMG ${9+5*l}`},
  storm: {name:"Storm of the Damned",icon:"🌩",max:5,base:"weapon",desc:l=>`Lightning strikes ${1+Math.floor((l-1)/2)} random foes. DMG ${12+7*l}`},
  dart: {name:"Bone Darts",icon:"🦴",max:5,base:"weapon",desc:l=>`Hurls ${1+Math.floor((l-1)/2)} homing darts. DMG ${8+4*l}`},
  hp:    {name:"Vampyric Heart",icon:"❤️",max:3,desc:l=>`Max HP +30 (now ${100+30*(l+1)})`},
  spd:   {name:"Swiftness",icon:"👟",max:3,desc:l=>`Move speed +15%`},
  dmg:   {name:"Cursed Edge",icon:"🗡️",max:5,desc:l=>`All damage +20% (total +${20*(l+1)}%)`},
  rate:  {name:"Frenzy",icon:"⚡",max:5,desc:l=>`Attack speed +20% (total +${20*(l+1)}%)`},
  magnet:{name:"Soul Magnet",icon:"🧲",max:3,desc:l=>`Pickup range +80`},
  regen: {name:"Bloodthirst",icon:"🩸",max:3,desc:l=>`Regen +1 HP/sec`},
  armor: {name:"Bone Armor",icon:"🛡️",max:3,desc:l=>`Damage taken -15% (total -${15*(l+1)}%)`}
};
const WEAPONS = {
  garlic: l=>({cd:.8, dmg:14+6*l, range:130+14*l, hits:1+Math.floor((l-1)/2)}),
  bullet: l=>({cd:.65,dmg:10+4*l, range:520, speed:430, pierce:1+Math.floor((l-1)/2), count:1+Math.floor((l-1)/3)}),
  nova:   l=>({cd:2.2,dmg:8+5*l, radius:90+16*l}),
  orbit:  l=>({blades:2+l, radius:70+9*l, dmg:9+5*l, speed:2.4}),
  storm:  l=>({cd:1.5,dmg:12+7*l, radius:140+14*l, hits:1+Math.floor((l-1)/2)}),
  dart:   l=>({cd:.85,dmg:8+4*l, speed:260, count:1+Math.floor((l-1)/2), turn:6}),
};
const ENEMY_TYPES = {
  zombie:   {hp:30,  speed:55,  dmg:10, r:14, xp:1,  color:"#6a9b52", eye:"#38ff9a", score:10},
  bat:      {hp:12,  speed:135, dmg:6,  r:10, xp:1,  color:"#8a5fc8", eye:"#d9b6ff", score:10},
  skeleton: {hp:55,  speed:82,  dmg:14, r:13, xp:2,  color:"#cfc9bd", eye:"#7ef3ff", score:25},
  brute:    {hp:170, speed:46,  dmg:20, r:20, xp:5,  color:"#4c6a3a", eye:"#ffd24d", score:60},
  boss:     {hp:1600,speed:62,  dmg:26, r:34, xp:40, color:"#5b2a8a", eye:"#ff5fd0", score:500}
};
const BOSS_INTERVAL=60; // LICH KING appears every 1 minute
const GEM_COLORS = {1:"#7ec8ff",2:"#9fe0ff",5:"#c9a0ff",10:"#ffd27a"};
const GEM_LIFE=30, GEM_FADE=5; // gems expire after 30s and fade out over the last 5s

/* ================= state ================= */
let S, player, cam, enemies, bullets, gems, parts, texts, rings, slashes;
let keys={};
function newState(){
  S={mode:"menu",time:0,score:0,kills:0,shake:0,shakeX:0,shakeY:0,spawnT:0,burstT:25,
     bossIdx:0,bossRef:null,level:1,xp:0,xpNeed:8,pendLevels:0};
  player={x:0,y:0,hp:100,maxHp:100,speed:220,r:13,magnet:80,regen:0,armor:0,
          invuln:0,face:1,move:0,anim:0,
          ups:{garlic:1,bullet:0,nova:0,orbit:0,storm:0,dart:0,hp:0,spd:0,dmg:0,rate:0,magnet:0,regen:0,armor:0},
          cds:{garlic:0,bullet:0,nova:0,orbit:0,storm:0,dart:0},orbitA:0};
  cam={x:0,y:0};
  enemies=[];bullets=[];gems=[];parts=[];texts=[];rings=[];slashes=[];
}
newState();
function hpScale(){const t=S.time;return 1+0.004*t+0.00002*t*t;}
function rateMult(){return 1+0.2*player.ups.rate;}
function dmgMult(){return 1+0.2*player.ups.dmg;}

/* ================= spawning & effects ================= */
function pickEnemyType(){
  const t=S.time,r=Math.random();
  if(t<30)   return r<.8?"zombie":"bat";
  if(t<90)   return r<.6?"zombie":(r<.85?"bat":"skeleton");
  if(t<180)  return r<.45?"zombie":(r<.75?"bat":(r<.92?"skeleton":"brute"));
  if(t<360)  return r<.35?"zombie":(r<.65?"bat":(r<.9?"skeleton":"brute"));
  return r<.3?"zombie":(r<.55?"bat":(r<.8?"skeleton":"brute"));
}
function spawnEnemy(type,fx,fy){
  const T=ENEMY_TYPES[type],hs=hpScale();
  const hp=Math.round(T.hp*hs);
  const e={type,x:fx!==undefined?fx:player.x,y:fy!==undefined?fy:player.y,
    r:T.r,hp,maxHp:hp,speed:T.speed*rand(.9,1.1),dmg:T.dmg,xp:T.xp,color:T.color,
    eye:T.eye,score:T.score,flash:0,kx:0,ky:0,wt:rand(0,TAU),orbit:false,lastOrbit:0,
    vx:0,vy:0,wander:rand(0,TAU)};
  if(fx===undefined){ // ring spawn offscreen
    const a=rand(0,TAU),d=Math.hypot(W,H)/2+rand(60,160);
    e.x=player.x+Math.cos(a)*d; e.y=player.y+Math.sin(a)*d;
  }
  enemies.push(e);
  return e;
}
function spawnBoss(){
  if(S.bossRef&&enemies.indexOf(S.bossRef)>=0){ // old LICH KING still alive → remove it
    const old=S.bossRef;
    enemies.splice(enemies.indexOf(old),1);
    burstParts(old.x,old.y,"#c95cff",40,260);
    S.shake=Math.max(S.shake,10);
    addText(old.x,old.y-40,"BANISHED","#d78cff",20);
    S.bossRef=null;
  }
  const a=rand(0,TAU),d=Math.hypot(W,H)/2+80;
  const e=spawnEnemy("boss",player.x+Math.cos(a)*d,player.y+Math.sin(a)*d);
  e.orbit=true; e.hp=e.maxHp=Math.round(ENEMY_TYPES.boss.hp*(1+S.time/120));
  S.bossRef=e; sfx("boss");
  addText(player.x,player.y-60,"⚰ THE LICH KING RISES","#d78cff",26);
}
function addText(x,y,txt,color,size){texts.push({x,y,txt,color,size:size||14,life:1});}
function burstParts(x,y,color,n,spd){
  for(let i=0;i<n;i++){const a=rand(0,TAU),v=rand(30,spd||160);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.3,.7),max:.7,color,size:rand(1.5,3.5)});}
}
function dropGems(x,y,xp){
  // split xp into gem values
  let left=xp;
  while(left>0){
    const v=left>=10&&Math.random()<.15?10:left>=5&&Math.random()<.3?5:left>=2&&Math.random()<.5?2:1;
    const a=rand(0,TAU),d=rand(4,20);
    gems.push({x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,v,flash:0,life:GEM_LIFE});
    left-=v; if(gems.length>400)break;
  }
}
function damageEnemy(e,dmg,kx,ky){
  e.hp-=dmg; e.flash=.12;
  if(kx!==undefined){e.kx+=kx;e.ky+=ky;}
  addText(e.x+rand(-6,6),e.y-e.r-6,Math.round(dmg),"#ffffff",12);
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  const i=enemies.indexOf(e); if(i<0)return;
  enemies.splice(i,1);
  S.kills++; S.score+=e.score;
  burstParts(e.x,e.y,e.color,12,200);
  dropGems(e.x,e.y,e.xp);
  if(e.type==="boss"){S.bossRef=null;burstParts(e.x,e.y,"#c95cff",40,260);S.shake=Math.max(S.shake,10);}
  sfx("die");
}
function gainXp(v){
  S.xp+=v;
  while(S.xp>=S.xpNeed){
    S.xp-=S.xpNeed; S.pendLevels++;
    S.xpNeed=Math.floor(8+S.level*3+S.level*S.level*.35);
  }
  if(S.pendLevels>0&&S.mode==="playing")openLevelUp();
}
function applyUpgrade(id){
  const u=UPGRADES[id],l=player.ups[id];
  player.ups[id]=l+1;
  if(id==="hp"){player.maxHp+=30;player.hp=Math.min(player.maxHp,player.hp+30);}
  else if(id==="spd")player.speed=220*1.15*(1+0.15*(l));
  else if(id==="magnet")player.magnet=80+80*(l+1);
  else if(id==="regen")player.regen=l+1;
  else if(id==="armor")player.armor=15*(l+1);
  buildWeaponChips();
  sfx("level");
}
/* ================= weapons ================= */
function nearestEnemies(x,y,range,limit){
  const r2=range*range,out=[];
  for(const e of enemies){const d=dist2(x,y,e.x,e.y);if(d<=r2)out.push([d,e]);}
  out.sort((a,b)=>a[0]-b[0]);
  return out.slice(0,limit).map(p=>p[1]);
}
function updateWeapons(dt){
  const rm=rateMult(),dm=dmgMult();
  if(player.ups.garlic>0){
    player.cds.garlic-=dt;
    if(player.cds.garlic<=0){
      const p=WEAPONS.garlic(player.ups.garlic);
      const targets=nearestEnemies(player.x,player.y,p.range,p.hits);
      if(targets.length){
        player.cds.garlic=p.cd/rm;
        for(const e of targets){
          const a=Math.atan2(e.y-player.y,e.x-player.x);
          slashes.push({x:player.x,y:player.y,angle:a,life:.22,max:.22,r:p.range*.62});
          damageEnemy(e,p.dmg*dm,Math.cos(a)*180,Math.sin(a)*180);
        }
        sfx("slash");
      } else player.cds.garlic=0;
    }
  }
  if(player.ups.bullet>0){
    player.cds.bullet-=dt;
    if(player.cds.bullet<=0){
      const p=WEAPONS.bullet(player.ups.bullet);
      const t=nearestEnemies(player.x,player.y,p.range,1)[0];
      if(t){
        player.cds.bullet=p.cd/rm;
        for(let i=0;i<p.count;i++){
          const a=Math.atan2(t.y-player.y,t.x-player.x)+(i-(p.count-1)/2)*.18;
          bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*p.speed,vy:Math.sin(a)*p.speed,
            dmg:p.dmg*dm,pierce:p.pierce,life:1.4,r:5});
        }
        sfx("shoot");
      } else player.cds.bullet=0;
    }
  }
  if(player.ups.nova>0){
    player.cds.nova-=dt;
    if(player.cds.nova<=0){
      const p=WEAPONS.nova(player.ups.nova);
      const inR=enemies.filter(e=>dist2(player.x,player.y,e.x,e.y)<=(p.radius+e.r)**2);
      if(inR.length){
        player.cds.nova=p.cd/rm;
        rings.push({x:player.x,y:player.y,r:p.radius,life:.45,max:.45,color:"#9fe8ff"});
        for(const e of inR){
          const a=Math.atan2(e.y-player.y,e.x-player.x);
          damageEnemy(e,p.dmg*dm,Math.cos(a)*120,Math.sin(a)*120);
        }
        sfx("nova");
      } else player.cds.nova=0;
    }
  }
  if(player.ups.orbit>0){
    const p=WEAPONS.orbit(player.ups.orbit);
    player.orbitA+=p.speed*dt;
    for(let i=0;i<p.blades;i++){
      const a=player.orbitA+i*TAU/p.blades;
      const bx=player.x+Math.cos(a)*p.radius, by=player.y+Math.sin(a)*p.radius;
      for(const e of enemies){
        if(S.time-e.lastOrbit>.55 && dist2(bx,by,e.x,e.y)<=(12+e.r)**2){
          e.lastOrbit=S.time;
          const aa=Math.atan2(e.y-player.y,e.x-player.x);
          damageEnemy(e,p.dmg*dm,Math.cos(aa)*100,Math.sin(aa)*100);
        }
      }
    }
  }
  if(player.ups.storm>0){
    player.cds.storm-=dt;
    if(player.cds.storm<=0){
      const p=WEAPONS.storm(player.ups.storm);
      const inR=enemies.filter(e=>dist2(player.x,player.y,e.x,e.y)<=(p.radius+e.r)**2);
      if(inR.length){
        player.cds.storm=p.cd/rm;
        inR.sort(()=>Math.random()-.5);
        for(const e of inR.slice(0,p.hits)){
          burstParts(e.x,e.y,"#9fe8ff",8,150);
          rings.push({x:e.x,y:e.y,r:16,life:.3,max:.3,color:"#9fe8ff"});
          damageEnemy(e,p.dmg*dm,0,0);
        }
        sfx("nova");
      } else player.cds.storm=0;
    }
  }
  if(player.ups.dart>0){
    const p=WEAPONS.dart(player.ups.dart);
    player.cds.dart-=dt;
    if(player.cds.dart<=0){
      player.cds.dart=p.cd/rm;
      for(let i=0;i<p.count;i++){
        const a=S.time*1.3+i*TAU/p.count;
        bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*p.speed,vy:Math.sin(a)*p.speed,
          dmg:p.dmg*dm,pierce:0,life:2.2,r:5,home:1,turn:p.turn,sc:"#d8cfa8",fc:"#efe6c8"});
      }
      sfx("shoot");
    }
  }
}
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.home){
      let best=null,bd=1e18;
      for(const e of enemies){const d2=(e.x-b.x)**2+(e.y-b.y)**2;if(d2<bd){bd=d2;best=e;}}
      if(best){
        const cur=Math.atan2(b.vy,b.vx);
        let want=Math.atan2(best.y-b.y,best.x-b.x);
        let diff=want-cur;
        while(diff>Math.PI)diff-=TAU;
        while(diff<-Math.PI)diff+=TAU;
        const step=b.turn*dt;
        const na=cur+(diff>0?Math.min(step,diff):Math.max(-step,diff));
        const sp=Math.hypot(b.vx,b.vy);
        b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
      }
    }
    let dead=b.life<=0;
    if(!dead)for(const e of enemies){
      if(dist2(b.x,b.y,e.x,e.y)<=(b.r+e.r)**2){
        const a=Math.atan2(b.vy,b.vx);
        damageEnemy(e,b.dmg,Math.cos(a)*90,Math.sin(a)*90);
        b.pierce--;
        if(b.pierce<0){dead=true;break;}
      }
    }
    if(dead)bullets.splice(i,1);
  }
}
function hitPlayer(e){
  if(player.invuln>0)return;
  const d=e.dmg*(1-0.15*Math.min(3,player.armor/15));
  player.hp-=d; player.invuln=.5; S.shake=Math.max(S.shake,7);
  const a=Math.atan2(player.y-e.y,player.x-e.x);
  player.x+=Math.cos(a)*26; player.y+=Math.sin(a)*26;
  e.x-=Math.cos(a)*30; e.y-=Math.sin(a)*30;
  burstParts(player.x,player.y,"#ff4d63",8,140);
  sfx("hitp");
  if(player.hp<=0)gameOver();
}
function updateEnemies(dt){
  for(const e of enemies){
    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
    let mx=dx/d, my=dy/d;
    if(e.type==="bat"){e.wt+=dt*5;mx+=Math.cos(e.wt)*.5;my+=Math.sin(e.wt)*.5;}
    if(e.type==="brute"){e.wander+=dt*.8;mx+=Math.cos(e.wander)*.25;my+=Math.sin(e.wander)*.25;}
    const ml=Math.hypot(mx,my)||1;
    e.vx=mx/ml*e.speed; e.vy=my/ml*e.speed;
    e.x+=(e.vx+e.kx)*dt; e.y+=(e.vy+e.ky)*dt;
    e.kx*=Math.pow(.02,dt); e.ky*=Math.pow(.02,dt);
    e.flash=Math.max(0,e.flash-dt);
    if(d<e.r+player.r)hitPlayer(e);
    if(d>2600){e.hp=0;killEnemy(e);} // cull distant stragglers (no loot)
  }
  // light separation so enemies don't stack
  for(let i=0;i<enemies.length;i++){
    const a=enemies[i];
    for(let j=i+1;j<Math.min(enemies.length,i+4);j++){
      const b=enemies[j];
      const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,min=(a.r+b.r)*.8;
      if(d2<min*min&&d2>0){const d=Math.sqrt(d2),push=(min-d)/2,nx=dx/d,ny=dy/d;
        a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push;}
    }
  }
}
function updateGems(dt){
  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i];
    g.life-=dt;
    if(g.life<=0){gems.splice(i,1);continue;}
    const d2=dist2(g.x,g.y,player.x,player.y);
    if(d2<player.magnet*player.magnet){
      const d=Math.sqrt(d2)||1,s=380*(1-d/player.magnet)+120;
      g.x+=(player.x-g.x)/d*s*dt; g.y+=(player.y-g.y)/d*s*dt;
    }
    if(d2<(player.r+8)**2){
      gems.splice(i,1);
      gainXp(g.v);
      addText(player.x,player.y-24,"+"+g.v,"#9fe0ff",13);
      sfx("gem");
    }
  }
}
function updateFx(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=34*dt;t.life-=dt*.9;if(t.life<=0)texts.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){rings[i].life-=dt;if(rings[i].life<=0)rings.splice(i,1);}
  for(let i=slashes.length-1;i>=0;i--){slashes[i].life-=dt;if(slashes[i].life<=0)slashes.splice(i,1);}
}
function update(dt){
  S.time+=dt;
  if(S.time>=WIN_TIME){winGame();return;}
  let ax=0,ay=0;
  if(keys.w||keys.arrowup)ay-=1; if(keys.s||keys.arrowdown)ay+=1;
  if(keys.a||keys.arrowleft)ax-=1; if(keys.d||keys.arrowright)ax+=1;
  const m=Math.hypot(ax,ay);
  player.move=m>0?1:0;
  if(m>0){player.x+=ax/m*player.speed*dt;player.y+=ay/m*player.speed*dt;player.face=ax<0?-1:1;player.anim+=dt*10;}
  player.invuln=Math.max(0,player.invuln-dt);
  player.hp=Math.min(player.maxHp,player.hp+player.regen*dt);
  S.spawnT-=dt;
  if(S.spawnT<=0&&enemies.length<240){
    S.spawnT=Math.max(.22,1.2-S.time/180);
    const n=1+Math.floor(S.time/90)+(Math.random()<.3?1:0);
    for(let i=0;i<n;i++)spawnEnemy(pickEnemyType());
  }
  S.burstT-=dt;
  if(S.burstT<=0){
    S.burstT=rand(22,40);
    const a0=rand(0,TAU);
    for(let i=0;i<10;i++){
      const a=a0+i/10*TAU,d=Math.hypot(W,H)/2+80;
      spawnEnemy("bat",player.x+Math.cos(a)*d,player.y+Math.sin(a)*d);
    }
  }
  if(S.bossIdx<Math.floor(WIN_TIME/BOSS_INTERVAL)&&S.time>=(S.bossIdx+1)*BOSS_INTERVAL){
    S.bossIdx++; spawnBoss();
  }
  updateWeapons(dt); updateBullets(dt); updateEnemies(dt); updateGems(dt); updateFx(dt);
  S.shake=Math.max(0,S.shake-dt*18);
  S.shakeX=rand(-1,1)*S.shake; S.shakeY=rand(-1,1)*S.shake;
  cam.x=player.x-W/2+S.shakeX; cam.y=player.y-H/2+S.shakeY;
}
/* ================= rendering ================= */
function drawBackground(){
  ctx.fillStyle="#120e1c";ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H*.2,50,W/2,H*.2,Math.max(W,H)*.7);
  g.addColorStop(0,"rgba(120,80,200,.10)");g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const T=90;
  const x0=Math.floor(cam.x/T),x1=Math.floor((cam.x+W)/T);
  const y0=Math.floor(cam.y/T),y1=Math.floor((cam.y+H)/T);
  ctx.fillStyle="rgba(160,140,220,.14)";
  for(let tx=x0;tx<=x1;tx++)for(let ty=y0;ty<=y1;ty++){
    for(let k=0;k<3;k++){
      const px=tx*T+hash2(tx*7+k,ty*13)*T, py=ty*T+hash2(tx*11,ty*5+k)*T;
      const s=hash2(tx,ty*3+k)*2+.5;
      ctx.fillRect(px-cam.x,py-cam.y,s,s);
    }
  }
}
function drawGem(g){
  const sx=g.x-cam.x, sy=g.y-cam.y;
  if(sx<-30||sy<-30||sx>W+30||sy>H+30)return;
  const c=GEM_COLORS[g.v]||"#7ec8ff", s=4+g.v*.6, t=performance.now()/300;
  ctx.save();ctx.translate(sx,sy);ctx.rotate(t%TAU);
  ctx.globalAlpha=g.life<GEM_FADE?Math.max(.2,g.life/GEM_FADE):1;
  ctx.shadowColor=c;ctx.shadowBlur=8;
  ctx.fillStyle=c;
  ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s,0);ctx.lineTo(0,s);ctx.lineTo(-s,0);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawEnemy(e){
  const x=e.x-cam.x, y=e.y-cam.y;
  if(x<-60||y<-60||x>W+60||y>H+60)return;
  const t=performance.now()/1000;
  ctx.save();ctx.translate(x,y);
  const squish=e.type==="bat"?1+Math.sin(t*14+e.wt)*.15:1+Math.sin(t*6+e.wt)*.05;
  ctx.scale(squish,2-squish);
  ctx.fillStyle=e.flash>0?"#ffffff":e.color;
  ctx.shadowColor=e.color;ctx.shadowBlur=e.type==="boss"?18:6;
  ctx.beginPath();ctx.arc(0,0,e.r,0,TAU);ctx.fill();
  ctx.shadowBlur=0;
  if(e.type==="bat"){
    ctx.fillStyle=e.flash>0?"#fff":"rgba(138,95,200,.85)";
    const fl=Math.sin(t*14+e.wt)*.5+.6;
    ctx.beginPath();ctx.moveTo(-e.r*.6,-2);ctx.lineTo(-e.r*1.9,-e.r*.8*fl);ctx.lineTo(-e.r*.9,e.r*.4);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(e.r*.6,-2);ctx.lineTo(e.r*1.9,-e.r*.8*fl);ctx.lineTo(e.r*.9,e.r*.4);ctx.closePath();ctx.fill();
  }
  if(e.type==="boss"){
    ctx.strokeStyle="rgba(201,92,255,.6)";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,e.r+6+Math.sin(t*3)*3,0,TAU);ctx.stroke();
  }
  const a=Math.atan2(player.y-e.y,player.x-e.x);
  const ex=Math.cos(a)*e.r*.35, ey=Math.sin(a)*e.r*.35, eo=e.r*.22;
  ctx.fillStyle=e.flash>0?"#333":e.eye;
  ctx.beginPath();ctx.arc(ex-Math.sin(a)*eo,ey+Math.cos(a)*eo,e.type==="boss"?4:2.4,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(ex+Math.sin(a)*eo,ey-Math.cos(a)*eo,e.type==="boss"?4:2.4,0,TAU);ctx.fill();
  ctx.restore();
  if(e.maxHp>60&&e.hp<e.maxHp){
    const w=e.r*2, pct=e.hp/e.maxHp;
    ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(x-w/2,y-e.r-10,w,4);
    ctx.fillStyle="#e0243e";ctx.fillRect(x-w/2,y-e.r-10,w*pct,4);
  }
}
function drawPlayer(){
  const x=player.x-cam.x, y=player.y-cam.y;
  const bob=player.move?Math.sin(player.anim)*2:0;
  ctx.save();ctx.translate(x,y+bob);
  if(player.invuln>0&&Math.floor(performance.now()/80)%2===0)ctx.globalAlpha=.45;
  ctx.scale(player.face,1);
  ctx.fillStyle="#241533";
  ctx.beginPath();
  ctx.moveTo(-2,-6);
  ctx.quadraticCurveTo(-13,2+Math.sin(performance.now()/160)*2,-10,14);
  ctx.lineTo(-4,9);ctx.lineTo(0,13);ctx.lineTo(4,9);ctx.lineTo(10,14);
  ctx.quadraticCurveTo(12,2,2,-6);
  ctx.closePath();ctx.fill();
  ctx.fillStyle="#e8d9c9";
  ctx.beginPath();ctx.arc(0,-8,7,0,TAU);ctx.fill();
  ctx.fillStyle="#1a1026";
  ctx.beginPath();ctx.arc(0,-10,7,Math.PI,TAU);ctx.fill();
  ctx.fillRect(-7,-11,3,7);
  ctx.fillStyle="#ff2044";
  ctx.beginPath();ctx.arc(2.5,-8,1.6,0,TAU);ctx.arc(6,-8,1.4,0,TAU);ctx.fill();
  ctx.restore();
}
function drawFx(){
  for(const b of bullets){
    const x=b.x-cam.x,y=b.y-cam.y;
    ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(b.vy,b.vx));
    ctx.shadowColor=b.sc||"#ffd27a";ctx.shadowBlur=10;
    ctx.fillStyle=b.fc||"#ffe9b8";
    ctx.beginPath();ctx.ellipse(0,0,8,3.5,0,0,TAU);ctx.fill();
    ctx.restore();
  }
  for(const r of rings){
    const p=1-r.life/r.max, x=r.x-cam.x, y=r.y-cam.y;
    ctx.strokeStyle=r.color;ctx.globalAlpha=(r.life/r.max)*.8;ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(x,y,r.r*(0.3+p*.7),0,TAU);ctx.stroke();
    ctx.globalAlpha=1;
  }
  for(const s of slashes){
    const p=1-s.life/s.max, x=s.x-cam.x, y=s.y-cam.y;
    ctx.save();ctx.translate(x,y);ctx.rotate(s.angle);
    ctx.globalAlpha=(s.life/s.max)*.9;
    ctx.strokeStyle="#cfe8ff";ctx.lineWidth=5;ctx.shadowColor="#9fe0ff";ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(0,0,s.r*.55+s.r*.45*p,-.9,.9);ctx.stroke();
    ctx.restore();ctx.globalAlpha=1;
  }
  if(player.ups.orbit>0){
    const p=WEAPONS.orbit(player.ups.orbit);
    for(let i=0;i<p.blades;i++){
      const a=player.orbitA+i*TAU/p.blades;
      const x=player.x+Math.cos(a)*p.radius-cam.x, y=player.y+Math.sin(a)*p.radius-cam.y;
      ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);
      ctx.shadowColor="#b07cff";ctx.shadowBlur=10;
      ctx.fillStyle="#d9c4ff";
      ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(5,4);ctx.lineTo(-5,4);ctx.closePath();ctx.fill();
      ctx.restore();
    }
  }
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-cam.x-p.size/2,p.y-cam.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
  ctx.textAlign="center";
  for(const t of texts){
    ctx.globalAlpha=Math.min(1,t.life);
    ctx.font=`800 ${t.size}px 'Segoe UI',sans-serif`;
    ctx.fillStyle=t.color;
    ctx.shadowColor="rgba(0,0,0,.8)";ctx.shadowBlur=4;
    ctx.fillText(t.txt,t.x-cam.x,t.y-cam.y);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}
/* ================= HUD & UI ================= */
function buildWeaponChips(){
  const box=$("weapons");box.innerHTML="";

function updateHud(){
  const pct=Math.max(0,player.hp/player.maxHp*100);
  $("hpbar").style.width=pct+"%";
  $("hpwrap").classList.toggle("low",pct<30);
  $("xpbar").style.width=Math.min(100,S.xp/S.xpNeed*100)+"%";
  $("levelbadge").textContent="LV "+S.level;
  const rem=WIN_TIME-S.time;

  $("kills").textContent=S.kills;

  if(S.bossRef&&S.bossRef.hp>0){
    bb.style.display="block";
    $("bossfill").style.width=Math.max(0,S.bossRef.hp/S.bossRef.maxHp*100)+"%";
  } else bb.style.display="none";
  $("weapons").classList.toggle("show",S.mode==="paused");
}
function rollChoices(){
  const pool=[];
  for(const id in UPGRADES){
    const u=UPGRADES[id],lv=player.ups[id];
    if(lv<u.max)pool.push({id,w:u.base==="weapon"?3:2});
  }
  const out=[];
  while(out.length<3&&pool.length){
    const tot=pool.reduce((s,p)=>s+p.w,0);
    let r=Math.random()*tot;
    for(let i=0;i<pool.length;i++){
      r-=pool[i].w;
      if(r<=0){out.push(pool[i].id);pool.splice(i,1);break;}
    }
  }
  if(!out.length)out.push("heal");
  return out;
}
function openLevelUp(){
  S.mode="levelup";
  const box=$("lvlChoices");box.innerHTML="";
  const ids=S._choices=rollChoices();
  ids.forEach((id,i)=>{
    const u=id==="heal"?{name:"Blood Ritual",icon:"🩸",max:1,desc:()=>"Restore 40% HP"}:UPGRADES[id];
    const lv=player.ups[id]||0;
    const d=document.createElement("div");d.className="choice";
    d.innerHTML=`<div class="ic">${u.icon}</div>
      <div class="nm">${u.name}</div>
      ${id!=="heal"?`<div class="lv">LV ${lv} → ${lv+1} / ${u.max}</div>`:""}
      <div class="ds">${u.desc(lv)}</div>
      <div class="key">[${i+1}]</div>`;
    d.onclick=()=>pickUpgrade(id);
    box.appendChild(d);
  });
  $("levelup").classList.remove("hidden");
}
function pickUpgrade(id){
  $("levelup").classList.add("hidden");
  if(id==="heal")player.hp=Math.min(player.maxHp,player.hp+player.maxHp*.4);
  else applyUpgrade(id);
  S.level++;
  S.pendLevels--;
  if(S.pendLevels>0){openLevelUp();return;}
  S.mode="playing";
}
function showScreen(html){

      Score <b>${S.score.toLocaleString()}</b>
    </div>
    <button class="big" onclick="startGame()">RISE AGAIN</button>`);
}
function winGame(){
  S.mode="win";sfx("win");
  showScreen(`<h1 class="title">DAWN <span class="vamp">BREAKS</span></h1>
    <div class="sub">you survived the night — the sun has risen</div>
    <div class="stats">
      Survived <b>${fmtTime(WIN_TIME)}</b><br>
      Level <b>${S.level}</b> · Kills <b>${S.kills}</b><br>
      Score <b>${S.score.toLocaleString()}</b>
    </div>
    <button class="big" onclick="startGame()">HUNT AGAIN</button>`);
}
function showMenu(){
  S.mode="menu";
  const touch=document.body.classList.contains("touch");
  showScreen(`<h1 class="title"><span class="vamp">VAMPYRE</span> SURVIVORS</h1>
    <div class="sub">survive 15 minutes against the horde</div>
    <div class="controls">
      ${touch?"<b>TOUCH + HOLD</b> anywhere — joystick follows your finger":"<b>W A S D</b> / <b>ARROWS</b> move"} &nbsp;·&nbsp; your weapons attack automatically<br>
      collect <b style="color:#9fe0ff">◆ XP gems</b> to level up &nbsp;·&nbsp; pick 1 of 3 upgrades<br>
      ${touch?"<b>⏸</b> pause &nbsp;·&nbsp; <b>🔊</b> mute":"<b>P</b> pause &nbsp;·&nbsp; <b>M</b> mute"} &nbsp;·&nbsp; beware the <b style="color:#d78cff">LICH KING</b>
    </div>
    <button class="big" onclick="startGame()">ENTER THE NIGHT</button>`);
}
/* ================= input ================= */
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
  keys[k]=true;
  if(k==="m"){muted=!muted;$("mute").textContent=muted?"M muted":"M mute";
    if(muted)music.pause();
    else if(S.mode!=="menu")music.play().catch(()=>{});}
  if(S.mode==="playing"&&(k==="p"||k==="escape"))S.mode="paused";
  else if(S.mode==="paused"&&(k==="p"||k==="escape"||k==="enter"||k===" "))S.mode="playing";
  if(S.mode==="levelup"&&["1","2","3"].includes(k)){
    const i=+k-1;if(S._choices&&S._choices[i])pickUpgrade(S._choices[i]);
  }
  if((S.mode==="menu"||S.mode==="over"||S.mode==="win")&&(k==="enter"||k===" "||k==="r"))startGame();
});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});
addEventListener("blur",()=>{if(S.mode==="playing")S.mode="paused";});

/* ================= touch controls (smartphone) ================= */
if(("ontouchstart" in window)||navigator.maxTouchPoints>0)document.body.classList.add("touch");
(function(){
  if(!("ontouchstart" in window)&&navigator.maxTouchPoints===0)return;
  const joy=$("joy"),stick=$("joystick");
  const R=60; // joystick base radius (px) — keep in sync with #joy CSS (120px)
  let activeId=null,ox=0,oy=0; // active finger id + joystick base center
  function place(x,y){
    const m=R+6;
    ox=clamp(x,m,innerWidth-m);
    oy=clamp(y,m,innerHeight-m);
    joy.style.left=(ox-R)+"px";
    joy.style.top=(oy-R)+"px";
    joy.classList.add("on");
  }
  function apply(x,y){
    let dx=x-ox,dy=y-oy;
    const max=R-12,d=Math.hypot(dx,dy);
    if(d>max){dx*=max/d;dy*=max/d;}
    stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
    const th=max*.35;
    keys["w"]=dy<-th;keys["s"]=dy>th;keys["a"]=dx<-th;keys["d"]=dx>th;
  }
  function release(e){
    for(const t of e.changedTouches)if(t.identifier===activeId){
      activeId=null;
      joy.classList.remove("on");
      stick.style.transform="translate(-50%,-50%)";
      keys["w"]=keys["s"]=keys["a"]=keys["d"]=false;
    }
  }
  // floating joystick: appears wherever you touch (not fixed to a corner)
  document.addEventListener("touchstart",e=>{
    for(const t of e.changedTouches){
      if(activeId!==null)continue;               // already steering with another finger
      if(t.target.closest("button"))continue;    // let buttons (pause/mute/upgrades/start) work
      if(S.mode!=="playing")continue;            // only steer during gameplay
      e.preventDefault();
      activeId=t.identifier;
      place(t.clientX,t.clientY);
      apply(t.clientX,t.clientY);
    }
  },{passive:false});
  document.addEventListener("touchmove",e=>{
    if(activeId===null)return;
    for(const t of e.changedTouches)if(t.identifier===activeId){
      e.preventDefault();
      apply(t.clientX,t.clientY);
    }
  },{passive:false});
  document.addEventListener("touchend",release);
  document.addEventListener("touchcancel",release);
  $("tbtn-pause").addEventListener("click",()=>{if(S.mode==="playing")S.mode="paused";else if(S.mode==="paused")S.mode="playing";});
  $("tbtn-mute").addEventListener("click",()=>{
    muted=!muted;$("mute").textContent=muted?"M muted":"M mute";
    $("tbtn-mute").textContent=muted?"🔇":"🔊";
    if(muted)music.pause();
    else if(S.mode!=="menu")music.play().catch(()=>{});
  });
})();

/* ================= main loop ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S.mode==="playing")update(dt);
  drawBackground();
  for(const g of gems)drawGem(g);
  for(const e of enemies)drawEnemy(e);
  if(S.mode!=="over"&&S.mode!=="win")drawPlayer();
  drawFx();
  const lowhp=1-player.hp/player.maxHp;
  if(lowhp>0.5&&S.mode==="playing"){
    const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.62);
    v.addColorStop(0,"rgba(120,0,20,0)");
    v.addColorStop(1,`rgba(140,0,20,${(lowhp-.5)*.9})`);
    ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  }
  updateHud();
  if(S.mode==="paused"){
    ctx.fillStyle="rgba(6,4,12,.55)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#e9dcff";ctx.textAlign="center";
    ctx.font="800 42px 'Segoe UI',sans-serif";
    ctx.fillText("PAUSED",W/2,H/2-8);
    ctx.font="600 15px 'Segoe UI',sans-serif";
    ctx.fillStyle="#b79be0";
    ctx.fillText("press P or tap ⏸ to continue",W/2,H/2+22);
  }
  requestAnimationFrame(frame);
}
showMenu();
buildWeaponChips();
requestAnimationFrame(frame);
</script>
